# OpenFake-27 headline closed-set config. Recipe matches the paper's stated
# architecture (3-block [256,512,1024], dropout 0.5, wd 1e-3) and schedule
# (75 epochs, cosine 1e-3 -> 1e-6, batch 256 patches of 64x64, early stopping
# with patience 15). Set OPENFAKE_DATA_ROOT to the OpenFake "v2" split
# directory before running.

dataset:
  label_map: configs/label_maps/openfake_27class.json
  data_root: ${OPENFAKE_DATA_ROOT}
  patch: 64
  presplit: true

augment_train:
  flip: true

model:
  conv_channels: [256, 512, 1024]
  dropout: 0.5

train:
  epochs: 75
  batch_size: 256
  num_workers: 20
  lr: 1.0e-3
  weight_decay: 1.0e-3
  lr_min: 1.0e-6
  early_stopping_patience: 15
  label_smoothing: 0.0
  stats_batch_size: 32
